<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Polymarket</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            bg: '#0f1117',
            card: '#1a1d27',
            cardHover: '#222633',
            border: '#2a2d3a',
            accent: '#6366f1',
            green: '#22c55e',
            red: '#ef4444',
            amber: '#f59e0b',
          }
        }
      }
    }
  </script>
  <style>
    body { background: #0f1117; font-family: system-ui, -apple-system, sans-serif; }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-thumb { background: #3a3d4a; border-radius: 3px; }
    .tab-active { border-bottom: 2px solid #6366f1; color: #fff; }
    .tab-inactive { color: #6b7280; }
    .tab-inactive:hover { color: #9ca3af; }
    .spinner { border: 3px solid #2a2d3a; border-top: 3px solid #6366f1; border-radius: 50%; width: 24px; height: 24px; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .fade-in { animation: fadeIn 0.3s ease-in; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .alert-pulse { animation: pulse 2s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }
  </style>
</head>
<body class="bg-bg text-white min-h-screen">

  <header class="border-b border-border px-6 py-4 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <div class="w-8 h-8 rounded-lg bg-accent flex items-center justify-center font-bold text-sm">P</div>
      <h1 class="text-xl font-semibold">Polymarket</h1>
      <span class="text-xs text-gray-500 mt-1">Sharp Tracker</span>
    </div>
    <button onclick="openAddModal()" class="bg-accent hover:bg-indigo-600 text-white text-sm px-4 py-2 rounded-lg transition">
      + Add Wallet
    </button>
  </header>

  <nav class="border-b border-border px-6 flex gap-6">
    <button onclick="switchTab('alerts')" id="tab-alerts" class="py-3 text-sm font-medium tab-active relative">
      Alerts <span id="alert-badge" class="hidden ml-1 bg-red text-white text-[10px] px-1.5 py-0.5 rounded-full font-bold"></span>
    </button>
    <button onclick="switchTab('watchlist')" id="tab-watchlist" class="py-3 text-sm font-medium tab-inactive">Watchlist</button>
    <button onclick="switchTab('leaderboard')" id="tab-leaderboard" class="py-3 text-sm font-medium tab-inactive">Leaderboard</button>
    <button onclick="switchTab('markets')" id="tab-markets" class="py-3 text-sm font-medium tab-inactive">Markets</button>
  </nav>

  <main class="p-6 max-w-7xl mx-auto">
    <div id="view-alerts"></div>
    <div id="view-watchlist" class="hidden"></div>
    <div id="view-leaderboard" class="hidden"></div>
    <div id="view-markets" class="hidden"></div>
  </main>

  <div id="add-modal" class="fixed inset-0 bg-black/60 flex items-center justify-center z-50 hidden">
    <div class="bg-card border border-border rounded-xl p-6 w-full max-w-md">
      <h2 class="text-lg font-semibold mb-4">Add Wallet</h2>
      <input id="input-address" type="text" placeholder="0x... wallet address"
        class="w-full bg-bg border border-border rounded-lg px-4 py-2.5 text-sm text-white placeholder-gray-500 focus:outline-none focus:border-accent mb-3">
      <input id="input-label" type="text" placeholder="Label (optional)"
        class="w-full bg-bg border border-border rounded-lg px-4 py-2.5 text-sm text-white placeholder-gray-500 focus:outline-none focus:border-accent mb-4">
      <div class="flex gap-3 justify-end">
        <button onclick="closeAddModal()" class="text-sm text-gray-400 hover:text-white px-4 py-2">Cancel</button>
        <button onclick="addWallet()" id="btn-add" class="bg-accent hover:bg-indigo-600 text-white text-sm px-4 py-2 rounded-lg transition">Add</button>
      </div>
      <p id="add-error" class="text-red text-xs mt-2 hidden"></p>
    </div>
  </div>

  <script>
    let currentTab = 'alerts';
    let wallets = [];
    let expandedWalletId = null;
    let pnlChart = null;
    let alertRefreshInterval = null;

    function switchTab(tab) {
      document.getElementById(`tab-${currentTab}`).className = 'py-3 text-sm font-medium tab-inactive';
      if (currentTab === 'alerts') {
        const badge = document.getElementById('alert-badge');
        document.getElementById(`tab-${currentTab}`).innerHTML = `Alerts <span id="alert-badge" class="${badge.className}">${badge.textContent}</span>`;
      }
      document.getElementById(`view-${currentTab}`).classList.add('hidden');
      currentTab = tab;
      document.getElementById(`tab-${tab}`).className = 'py-3 text-sm font-medium tab-active';
      if (tab === 'alerts') {
        const badge = document.getElementById('alert-badge');
        document.getElementById(`tab-${tab}`).innerHTML = `Alerts <span id="alert-badge" class="${badge.className}">${badge.textContent}</span>`;
      }
      document.getElementById(`view-${tab}`).classList.remove('hidden');

      if (tab === 'alerts') loadAlerts();
      else if (tab === 'watchlist') loadWallets();
      else if (tab === 'leaderboard') loadLeaderboard();
      else if (tab === 'markets') loadMarkets();
    }

    function fmt(n, decimals = 2) {
      if (n == null) return '-';
      return Number(n).toLocaleString('en-US', { minimumFractionDigits: decimals, maximumFractionDigits: decimals });
    }
    function fmtUsd(n) { return n == null ? '-' : '$' + fmt(n); }
    function fmtOdds(n) { return n > 0 ? '+' + n : '' + n; }
    function centsToAmerican(price) {
      if (price == null || price <= 0 || price >= 1) return '-';
      return price >= 0.5
        ? fmtOdds(Math.round(-100 * price / (1 - price)))
        : fmtOdds(Math.round(100 * (1 - price) / price));
    }
    function pnlColor(n) { return n > 0 ? 'text-green' : n < 0 ? 'text-red' : 'text-gray-400'; }
    function pnlSign(n) { return n > 0 ? '+' : ''; }
    function timeAgo(iso) {
      if (!iso) return 'never';
      const diff = Date.now() - new Date(iso).getTime();
      const mins = Math.floor(diff / 60000);
      if (mins < 1) return 'just now';
      if (mins < 60) return `${mins}m ago`;
      const hrs = Math.floor(mins / 60);
      if (hrs < 24) return `${hrs}h ago`;
      return `${Math.floor(hrs / 24)}d ago`;
    }
    function tsToDate(ts) {
      return new Date(ts * 1000).toLocaleString('en-US', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
    }

    // --- Alerts ---
    async function loadAlerts() {
      const el = document.getElementById('view-alerts');
      el.innerHTML = '<div class="flex justify-center py-12"><div class="spinner"></div></div>';
      try {
        const resp = await fetch('/api/alerts?limit=50');
        const alerts = await resp.json();
        renderAlerts(alerts);
        updateBadge();
      } catch {
        el.innerHTML = '<p class="text-gray-500 text-center py-12">Failed to load alerts</p>';
      }
    }

    async function updateBadge() {
      try {
        const resp = await fetch('/api/alerts/count');
        const { count } = await resp.json();
        const badge = document.getElementById('alert-badge');
        if (count > 0) {
          badge.textContent = count;
          badge.classList.remove('hidden');
        } else {
          badge.classList.add('hidden');
        }
      } catch {}
    }

    function renderAlerts(alerts) {
      const el = document.getElementById('view-alerts');
      if (!alerts.length) {
        el.innerHTML = `
          <div class="text-center py-20">
            <p class="text-gray-500 mb-2">No alerts yet</p>
            <p class="text-gray-600 text-sm">Add sharp wallets from the Leaderboard tab. Positions are checked every 5 minutes.</p>
          </div>`;
        return;
      }

      el.innerHTML = alerts.map(a => {
        const e7 = a.eternity7_match;
        const sharpSide = a.outcome || '';
        return `
        <div class="bg-card border border-amber rounded-xl mb-4 fade-in overflow-hidden">
          <div class="bg-amber/10 border-b border-amber/30 px-4 py-2 flex items-center justify-between">
            <div class="flex items-center gap-2">
              <span class="text-amber font-bold text-xs tracking-wider">WINDOW SHOPPER</span>
              <span class="text-gray-500 text-xs">·</span>
              <span class="text-gray-400 text-xs">${timeAgo(a.detected_at)}</span>
              ${a.sport ? `<span class="text-gray-600 text-[10px] px-1.5 py-0.5 rounded bg-bg">${a.sport}</span>` : ''}
            </div>
            <button onclick="dismissAlert(${a.id})" class="text-gray-600 hover:text-gray-400 text-xs px-2 py-1 rounded border border-border hover:border-gray-500 transition">Dismiss</button>
          </div>

          <div class="p-4">
            <div class="flex items-center gap-3 mb-3">
              ${a.wallet_image
                ? `<img src="${a.wallet_image}" class="w-8 h-8 rounded-full object-cover">`
                : `<div class="w-8 h-8 rounded-full bg-border flex items-center justify-center text-gray-500 text-xs">${(a.wallet_label || '??').slice(0,2).toUpperCase()}</div>`}
              <div>
                <div class="text-sm font-medium">${a.wallet_label}${a.wallet_roi_pct ? ` <span class="text-[10px] font-mono ${a.wallet_roi_pct > 0 ? 'text-green' : 'text-red'} ml-1">${a.wallet_roi_pct > 0 ? '+' : ''}${a.wallet_roi_pct}% ROI</span>` : ''}</div>
                ${a.wallet_pnl ? `<div class="text-[10px] font-mono text-gray-500">${a.wallet_pnl >= 0 ? '+' : ''}$${fmt(a.wallet_pnl, 0)} net</div>` : ''}
              </div>
              <div class="ml-auto text-right">
                <div class="text-sm font-mono font-semibold text-amber">$${fmt(a.size, 0)}</div>
                <div class="text-[10px] text-gray-500">at ${centsToAmerican(a.price)}</div>
              </div>
            </div>

            <div class="bg-bg rounded-lg p-3 mb-3">
              <div class="text-sm font-medium mb-1">${e7 ? (e7.match_short || e7.match || a.title) : a.title}</div>
              <div class="text-xs text-gray-500">${e7 ? e7.prop + (e7.stat ? ' · ' + e7.stat : '') : ''}</div>
              <div class="mt-2 flex items-center gap-3">
                <span class="text-xs font-medium text-amber">Sharp bet: <span class="text-white">${sharpSide}</span></span>
                ${e7 && e7.highest_ev != null ? `<span class="text-xs ${e7.highest_ev > 0 ? 'text-green' : 'text-gray-500'}">Market EV: ${e7.highest_ev > 0 ? '+' : ''}${e7.highest_ev.toFixed(1)}%</span>` : ''}
                ${e7 && e7.nvig ? `<span class="text-xs text-gray-500">No-vig: ${fmtOdds(Math.round(e7.nvig))}</span>` : ''}
              </div>
            </div>

            ${e7 ? renderE7Panel(e7, sharpSide, a.price) : ''}
          </div>
        </div>`;
      }).join('');
    }

    function sideMatchesOutcome(sideKey, outcome) {
      if (!outcome) return false;
      const s = sideKey.toLowerCase();
      const o = outcome.toLowerCase();
      const oWords = o.split(/\s+/);
      return oWords.some(w => w.length > 2 && s.includes(w));
    }

    function isBetterOdds(bookOdds, sharpOdds) {
      if (bookOdds > 0 && sharpOdds > 0) return bookOdds > sharpOdds;
      if (bookOdds < 0 && sharpOdds < 0) return bookOdds > sharpOdds;
      if (bookOdds > 0 && sharpOdds < 0) return true;
      return false;
    }

    function renderE7Panel(e7, sharpSide, sharpPrice) {
      const bestBooks = e7.best_books || {};
      const allBooks = e7.all_books || {};
      const bookEntries = Object.entries(allBooks);

      if (!bookEntries.length) return '';

      const sides = Object.keys(bestBooks);
      const sharpSideKey = sides.find(s => sideMatchesOutcome(s, sharpSide)) || sides[0];
      const sharpAm = sharpPrice >= 0.5
        ? Math.round(-100 * sharpPrice / (1 - sharpPrice))
        : Math.round(100 * (1 - sharpPrice) / sharpPrice);

      return `
        <div class="border border-border rounded-lg overflow-hidden">
          <div class="max-h-52 overflow-y-auto">
            <table class="w-full text-xs">
              <thead>
                <tr class="text-gray-500 border-b border-border">
                  <th class="text-left py-1.5 px-3">Book</th>
                  ${sides.map(side => `<th class="text-right py-1.5 px-3 ${side === sharpSideKey ? 'text-amber' : ''}">${side}${side === sharpSideKey ? ' ★' : ''}</th>`).join('')}
                  <th class="text-right py-1.5 px-3">EV</th>
                  <th class="text-right py-1.5 px-3"></th>
                </tr>
              </thead>
              <tbody>
                ${bookEntries.filter(([n]) => n !== 'Polymarket').slice(0, 20).map(([bookName, bookData]) => {
                  const isBest = sides.some(side => bestBooks[side]?.book === bookName);
                  const sharpData = bookData[sharpSideKey];
                  const betterAndEv = sharpData && isBetterOdds(sharpData.am_odds, sharpAm) && sharpData.ev > 0;
                  return `
                  <tr class="border-b border-border/30 ${betterAndEv ? 'bg-green/5' : isBest ? 'bg-green/5' : 'hover:bg-cardHover'}">
                    <td class="py-1.5 px-3">
                      <div class="flex items-center gap-1.5">
                        ${betterAndEv ? '<span class="w-2 h-2 rounded-full bg-green inline-block"></span>' : ''}
                        ${bookData.logo ? `<img src="${bookData.logo}" class="w-3.5 h-3.5 rounded">` : ''}
                        <span>${bookName}</span>
                      </div>
                    </td>
                    ${sides.map(side => {
                      const d = bookData[side];
                      const isSharp = side === sharpSideKey;
                      const better = isSharp && d && isBetterOdds(d.am_odds, sharpAm);
                      return d ? `
                        <td class="py-1.5 px-3 text-right font-mono ${better ? 'text-amber font-semibold' : isSharp ? 'text-gray-400' : ''}">${fmtOdds(d.am_odds)}</td>
                      ` : '<td class="py-1.5 px-3 text-right text-gray-600">-</td>';
                    }).join('')}
                    <td class="py-1.5 px-3 text-right font-mono ${sharpData?.ev > 0 ? 'text-green' : 'text-gray-500'}">${sharpData?.ev != null ? (sharpData.ev > 0 ? '+' : '') + sharpData.ev.toFixed(1) + '%' : '-'}</td>
                    <td class="py-1.5 px-3 text-right">
                      ${sharpData?.betlink ? `<a href="${sharpData.betlink}" target="_blank" class="text-accent hover:text-indigo-400">Bet</a>` : ''}
                    </td>
                  </tr>`;
                }).join('')}
              </tbody>
            </table>
          </div>
        </div>
        <div class="text-[9px] text-gray-600 text-center mt-2 px-3">Not financial advice. Informational only — do your own research before placing any wagers.</div>
      `;
    }

    async function dismissAlert(id) {
      try {
        await fetch(`/api/alerts/${id}/dismiss`, { method: 'POST' });
        loadAlerts();
      } catch {}
    }

    // --- Modal ---
    function openAddModal() {
      document.getElementById('add-modal').classList.remove('hidden');
      document.getElementById('input-address').value = '';
      document.getElementById('input-label').value = '';
      document.getElementById('add-error').classList.add('hidden');
      document.getElementById('input-address').focus();
    }
    function closeAddModal() { document.getElementById('add-modal').classList.add('hidden'); }

    async function addWallet() {
      const address = document.getElementById('input-address').value.trim();
      const label = document.getElementById('input-label').value.trim();
      const errEl = document.getElementById('add-error');
      const btn = document.getElementById('btn-add');

      if (!address) { errEl.textContent = 'Address required'; errEl.classList.remove('hidden'); return; }

      btn.disabled = true; btn.textContent = 'Adding...';
      try {
        const resp = await fetch('/api/wallets', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ address, label: label || null }),
        });
        if (!resp.ok) {
          const err = await resp.json();
          throw new Error(err.detail || 'Failed to add wallet');
        }
        closeAddModal();
        if (currentTab === 'watchlist') loadWallets();
      } catch (e) {
        errEl.textContent = e.message; errEl.classList.remove('hidden');
      } finally {
        btn.disabled = false; btn.textContent = 'Add';
      }
    }

    // --- Watchlist ---
    async function loadWallets() {
      const el = document.getElementById('view-watchlist');
      el.innerHTML = '<div class="flex justify-center py-12"><div class="spinner"></div></div>';
      try {
        const resp = await fetch('/api/wallets');
        wallets = await resp.json();
        renderWallets();
      } catch {
        el.innerHTML = '<p class="text-gray-500 text-center py-12">Failed to load wallets</p>';
      }
    }

    function renderWallets() {
      const el = document.getElementById('view-watchlist');
      if (!wallets.length) {
        el.innerHTML = `
          <div class="text-center py-20">
            <p class="text-gray-500 mb-4">No wallets tracked yet</p>
            <button onclick="openAddModal()" class="bg-accent hover:bg-indigo-600 text-white text-sm px-4 py-2 rounded-lg transition">+ Add Wallet</button>
          </div>`;
        return;
      }

      el.innerHTML = wallets.map(w => `
        <div class="bg-card border border-border rounded-xl mb-3 overflow-hidden fade-in">
          <div class="p-4 flex items-center justify-between cursor-pointer hover:bg-cardHover transition" onclick="toggleWallet(${w.id})">
            <div class="flex items-center gap-3">
              ${w.profile_image
                ? `<img src="${w.profile_image}" class="w-10 h-10 rounded-full object-cover">`
                : `<div class="w-10 h-10 rounded-full bg-border flex items-center justify-center text-gray-500 text-sm">${(w.label || w.profile_name || w.address.slice(2,4)).slice(0,2).toUpperCase()}</div>`}
              <div>
                <div class="font-medium text-sm">${w.label || w.profile_name || w.address.slice(0, 6) + '...' + w.address.slice(-4)}</div>
                <div class="text-xs text-gray-500 font-mono">${w.address.slice(0, 6)}...${w.address.slice(-4)}${w.x_username ? ` · @${w.x_username}` : ''}</div>
              </div>
            </div>
            <div class="flex items-center gap-6">
              ${w.roi_pct ? `<div class="text-right"><div class="text-sm font-mono font-semibold ${w.roi_pct > 0 ? 'text-green' : 'text-red'}">${w.roi_pct > 0 ? '+' : ''}${w.roi_pct}%</div><div class="text-[10px] text-gray-500">ROI</div></div>` : ''}
              <div class="text-right">
                <div class="text-sm font-medium">${fmtUsd(w.portfolio_value)}</div>
                <div class="text-xs text-gray-500">Synced ${timeAgo(w.last_synced)}</div>
              </div>
              <div class="flex gap-2">
                <button onclick="event.stopPropagation(); syncWallet(${w.id})" title="Sync" class="text-gray-500 hover:text-accent text-xs px-2 py-1 rounded border border-border hover:border-accent transition">Sync</button>
                <button onclick="event.stopPropagation(); removeWallet(${w.id})" title="Remove" class="text-gray-500 hover:text-red text-xs px-2 py-1 rounded border border-border hover:border-red transition">X</button>
              </div>
            </div>
          </div>
          <div id="wallet-detail-${w.id}" class="hidden"></div>
        </div>
      `).join('');
    }

    async function toggleWallet(id) {
      const detailEl = document.getElementById(`wallet-detail-${id}`);
      if (expandedWalletId === id) {
        detailEl.classList.add('hidden');
        expandedWalletId = null;
        return;
      }
      if (expandedWalletId !== null) {
        const prev = document.getElementById(`wallet-detail-${expandedWalletId}`);
        if (prev) prev.classList.add('hidden');
      }
      expandedWalletId = id;
      detailEl.classList.remove('hidden');
      detailEl.innerHTML = '<div class="flex justify-center py-8"><div class="spinner"></div></div>';

      try {
        const [posResp, tradeResp, pnlResp] = await Promise.all([
          fetch(`/api/wallets/${id}/positions`),
          fetch(`/api/wallets/${id}/trades?limit=50`),
          fetch(`/api/wallets/${id}/pnl`),
        ]);
        const positions = await posResp.json();
        const trades = await tradeResp.json();
        const pnl = await pnlResp.json();
        renderWalletDetail(id, positions, trades, pnl);
      } catch {
        detailEl.innerHTML = '<p class="text-gray-500 text-center py-8">Failed to load data</p>';
      }
    }

    function renderWalletDetail(id, positions, trades, pnl) {
      const el = document.getElementById(`wallet-detail-${id}`);
      const totalPnl = positions.reduce((s, p) => s + (Number(p.cashPnl) || 0), 0);

      el.innerHTML = `
        <div class="border-t border-border p-4 space-y-6 fade-in">
          <div class="grid grid-cols-3 gap-4">
            <div class="bg-bg rounded-lg p-3">
              <div class="text-xs text-gray-500 mb-1">Portfolio Value</div>
              <div class="text-lg font-semibold">${fmtUsd(pnl.current_value)}</div>
            </div>
            <div class="bg-bg rounded-lg p-3">
              <div class="text-xs text-gray-500 mb-1">Open Positions</div>
              <div class="text-lg font-semibold">${positions.length}</div>
            </div>
            <div class="bg-bg rounded-lg p-3">
              <div class="text-xs text-gray-500 mb-1">Total PnL</div>
              <div class="text-lg font-semibold ${pnlColor(totalPnl)}">${pnlSign(totalPnl)}${fmtUsd(totalPnl)}</div>
            </div>
          </div>

          ${pnl.history && pnl.history.length > 1 ? `
          <div class="bg-bg rounded-lg p-4">
            <div class="text-xs text-gray-500 mb-2">Portfolio Value History</div>
            <canvas id="pnl-chart-${id}" height="120"></canvas>
          </div>` : ''}

          <div>
            <h3 class="text-sm font-medium text-gray-400 mb-2">Positions (${positions.length})</h3>
            ${positions.length ? `
            <div class="overflow-x-auto">
              <table class="w-full text-xs">
                <thead>
                  <tr class="text-gray-500 border-b border-border">
                    <th class="text-left py-2 px-2">Market</th>
                    <th class="text-left py-2 px-2">Outcome</th>
                    <th class="text-right py-2 px-2">Size</th>
                    <th class="text-right py-2 px-2">Avg Price</th>
                    <th class="text-right py-2 px-2">Value</th>
                    <th class="text-right py-2 px-2">PnL</th>
                    <th class="text-right py-2 px-2">%</th>
                  </tr>
                </thead>
                <tbody>
                  ${positions.slice(0, 50).map(p => `
                  <tr class="border-b border-border/50 hover:bg-cardHover">
                    <td class="py-2 px-2 max-w-[200px] truncate">${p.title || '-'}</td>
                    <td class="py-2 px-2">${p.outcome || '-'}</td>
                    <td class="py-2 px-2 text-right font-mono">${fmt(p.size, 1)}</td>
                    <td class="py-2 px-2 text-right font-mono">${fmt(p.avgPrice, 3)}</td>
                    <td class="py-2 px-2 text-right font-mono">${fmtUsd(p.currentValue)}</td>
                    <td class="py-2 px-2 text-right font-mono ${pnlColor(p.cashPnl)}">${pnlSign(p.cashPnl)}${fmtUsd(p.cashPnl)}</td>
                    <td class="py-2 px-2 text-right font-mono ${pnlColor(p.percentPnl)}">${pnlSign(p.percentPnl)}${fmt(p.percentPnl * 100, 1)}%</td>
                  </tr>`).join('')}
                </tbody>
              </table>
            </div>` : '<p class="text-gray-500 text-sm">No open positions</p>'}
          </div>

          <div>
            <h3 class="text-sm font-medium text-gray-400 mb-2">Recent Trades</h3>
            ${trades.length ? `
            <div class="overflow-x-auto">
              <table class="w-full text-xs">
                <thead>
                  <tr class="text-gray-500 border-b border-border">
                    <th class="text-left py-2 px-2">Time</th>
                    <th class="text-left py-2 px-2">Market</th>
                    <th class="text-left py-2 px-2">Side</th>
                    <th class="text-right py-2 px-2">Size</th>
                    <th class="text-right py-2 px-2">Price</th>
                  </tr>
                </thead>
                <tbody>
                  ${trades.slice(0, 50).map(t => `
                  <tr class="border-b border-border/50 hover:bg-cardHover">
                    <td class="py-2 px-2 text-gray-400">${tsToDate(t.timestamp)}</td>
                    <td class="py-2 px-2 max-w-[200px] truncate">${t.title || '-'}</td>
                    <td class="py-2 px-2 font-medium ${t.side === 'BUY' ? 'text-green' : 'text-red'}">${t.side}</td>
                    <td class="py-2 px-2 text-right font-mono">${fmt(t.size, 1)}</td>
                    <td class="py-2 px-2 text-right font-mono">${fmt(t.price, 3)}</td>
                  </tr>`).join('')}
                </tbody>
              </table>
            </div>` : '<p class="text-gray-500 text-sm">No trades found</p>'}
          </div>
        </div>
      `;

      if (pnl.history && pnl.history.length > 1) {
        setTimeout(() => renderPnlChart(id, pnl.history), 50);
      }
    }

    function renderPnlChart(id, history) {
      const canvas = document.getElementById(`pnl-chart-${id}`);
      if (!canvas) return;
      if (pnlChart) { pnlChart.destroy(); pnlChart = null; }

      const labels = history.map(h => new Date(h.timestamp).toLocaleDateString('en-US', { month: 'short', day: 'numeric' }));
      const data = history.map(h => h.value);

      pnlChart = new Chart(canvas, {
        type: 'line',
        data: {
          labels,
          datasets: [{
            data,
            borderColor: '#6366f1',
            backgroundColor: 'rgba(99,102,241,0.1)',
            fill: true,
            tension: 0.3,
            pointRadius: 2,
            borderWidth: 2,
          }]
        },
        options: {
          responsive: true,
          plugins: { legend: { display: false } },
          scales: {
            x: { grid: { color: '#1a1d27' }, ticks: { color: '#6b7280', font: { size: 10 } } },
            y: { grid: { color: '#1a1d27' }, ticks: { color: '#6b7280', font: { size: 10 }, callback: v => '$' + v.toLocaleString() } },
          },
        },
      });
    }

    async function syncWallet(id) {
      try {
        await fetch(`/api/wallets/${id}/sync`, { method: 'POST' });
        loadWallets();
      } catch {}
    }

    async function removeWallet(id) {
      if (!confirm('Remove this wallet from your watchlist?')) return;
      try {
        await fetch(`/api/wallets/${id}`, { method: 'DELETE' });
        if (expandedWalletId === id) expandedWalletId = null;
        loadWallets();
      } catch {}
    }

    // --- Leaderboard ---
    let lbPeriod = 'WEEK';
    async function loadLeaderboard(period) {
      if (period) lbPeriod = period;
      const el = document.getElementById('view-leaderboard');
      el.innerHTML = '<div class="flex justify-center py-12"><div class="spinner"></div></div>';
      try {
        const resp = await fetch(`/api/leaderboard/sports?period=${lbPeriod}&limit=50`);
        const data = await resp.json();
        renderLeaderboard(data);
      } catch {
        el.innerHTML = '<p class="text-gray-500 text-center py-12">Failed to load leaderboard</p>';
      }
    }

    function renderLeaderboard(data) {
      const el = document.getElementById('view-leaderboard');
      const periods = ['DAY', 'WEEK', 'MONTH', 'ALL'];

      el.innerHTML = `
        <div class="flex gap-2 mb-4">
          ${periods.map(p => `
            <button onclick="loadLeaderboard('${p}')"
              class="text-xs px-3 py-1.5 rounded-lg transition ${p === lbPeriod ? 'bg-accent text-white' : 'bg-card text-gray-400 hover:text-white border border-border'}">${p.charAt(0) + p.slice(1).toLowerCase()}</button>
          `).join('')}
        </div>
        ${data.length ? `
        <div class="overflow-x-auto">
          <table class="w-full text-sm">
            <thead>
              <tr class="text-gray-500 text-xs border-b border-border">
                <th class="text-left py-2 px-3">#</th>
                <th class="text-left py-2 px-3">Trader</th>
                <th class="text-right py-2 px-3">Volume</th>
                <th class="text-right py-2 px-3">PnL</th>
                <th class="text-right py-2 px-3">ROI</th>
                <th class="text-right py-2 px-3"></th>
              </tr>
            </thead>
            <tbody>
              ${data.map(t => `
              <tr class="border-b border-border/50 hover:bg-card transition">
                <td class="py-3 px-3 text-gray-500">${t.rank}</td>
                <td class="py-3 px-3">
                  <div class="flex items-center gap-2">
                    ${t.profileImage ? `<img src="${t.profileImage}" class="w-7 h-7 rounded-full object-cover">` : `<div class="w-7 h-7 rounded-full bg-border"></div>`}
                    <div>
                      <div class="font-medium text-sm">${t.userName || t.proxyWallet?.slice(0, 8) || '-'}</div>
                      ${t.xUsername ? `<div class="text-xs text-gray-500">@${t.xUsername}</div>` : ''}
                    </div>
                  </div>
                </td>
                <td class="py-3 px-3 text-right font-mono text-sm">${fmtUsd(t.vol)}</td>
                <td class="py-3 px-3 text-right font-mono text-sm ${pnlColor(t.pnl)}">${pnlSign(t.pnl)}${fmtUsd(t.pnl)}</td>
                <td class="py-3 px-3 text-right font-mono text-sm ${pnlColor(t.roi_pct)}">${t.roi_pct != null ? (t.roi_pct > 0 ? '+' : '') + t.roi_pct + '%' : '-'}</td>
                <td class="py-3 px-3 text-right">
                  <button onclick="watchFromLeaderboard('${t.proxyWallet}', '${(t.userName || '').replace(/'/g, '')}')"
                    class="text-xs text-accent hover:text-indigo-400 transition">Watch</button>
                </td>
              </tr>`).join('')}
            </tbody>
          </table>
        </div>` : '<p class="text-gray-500 text-center py-12">No leaderboard data</p>'}
      `;
    }

    async function watchFromLeaderboard(address, name) {
      if (!address) return;
      try {
        await fetch('/api/wallets', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ address, label: name || null }),
        });
        switchTab('watchlist');
      } catch {}
    }

    // --- Markets ---
    let sportsMetadata = null;
    let selectedTagId = null;

    async function loadMarkets() {
      const el = document.getElementById('view-markets');
      el.innerHTML = '<div class="flex justify-center py-12"><div class="spinner"></div></div>';
      try {
        if (!sportsMetadata) {
          const metaResp = await fetch('/api/markets/sports/metadata');
          sportsMetadata = await metaResp.json();
        }
        const params = selectedTagId ? `?tag_id=${selectedTagId}` : '';
        const resp = await fetch(`/api/markets/sports${params}`);
        const markets = await resp.json();
        renderMarkets(markets);
      } catch {
        el.innerHTML = '<p class="text-gray-500 text-center py-12">Failed to load markets</p>';
      }
    }

    function renderMarkets(markets) {
      const el = document.getElementById('view-markets');

      el.innerHTML = `
        <div class="flex gap-2 mb-4 flex-wrap">
          <button onclick="filterSport(null)" class="text-xs px-3 py-1.5 rounded-lg transition ${!selectedTagId ? 'bg-accent text-white' : 'bg-card text-gray-400 hover:text-white border border-border'}">All</button>
          ${(sportsMetadata || []).map(s => {
            const tagId = s.tags ? s.tags.split(',')[0] : null;
            return tagId ? `
              <button onclick="filterSport(${tagId})"
                class="text-xs px-3 py-1.5 rounded-lg transition ${selectedTagId == tagId ? 'bg-accent text-white' : 'bg-card text-gray-400 hover:text-white border border-border'}">${s.sport}</button>
            ` : '';
          }).join('')}
        </div>
        ${markets.length ? `
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3">
          ${markets.map(m => `
          <div class="bg-card border border-border rounded-xl p-4 hover:border-accent/30 transition">
            <div class="flex items-start gap-3 mb-3">
              ${m.icon ? `<img src="${m.icon}" class="w-8 h-8 rounded-lg object-cover flex-shrink-0">` : ''}
              <h3 class="text-sm font-medium leading-snug">${m.question || m.title || '-'}</h3>
            </div>
            <div class="flex items-center gap-4 text-xs text-gray-500">
              <span>Vol: ${fmtUsd(m.volume)}</span>
              <span>Liq: ${fmtUsd(m.liquidity)}</span>
              ${m.outcomePrices ? `<span class="ml-auto font-mono text-white">${(JSON.parse(m.outcomePrices)[0] * 100).toFixed(0)}c</span>` : ''}
            </div>
          </div>`).join('')}
        </div>` : '<p class="text-gray-500 text-center py-12">No sports markets found</p>'}
      `;
    }

    function filterSport(tagId) {
      selectedTagId = tagId;
      loadMarkets();
    }

    // --- Init ---
    document.addEventListener('DOMContentLoaded', () => {
      loadAlerts();
      updateBadge();
      alertRefreshInterval = setInterval(() => {
        if (currentTab === 'alerts') loadAlerts();
        else updateBadge();
      }, 30000);
    });
  </script>
</body>
</html>
